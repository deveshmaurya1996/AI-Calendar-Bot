[project]
name = "ai-calendar-backend"
version = "0.1.0"
description = "AI Calendar API"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

# Pylance/Pyright: resolve third-party imports (e.g. PyJWT → `jwt`) from backend/.venv
[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
